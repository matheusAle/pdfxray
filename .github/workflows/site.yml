name: Site

# Deploys `site/` (pdfxray.app) when it changes on `main`: a Cloudflare Worker serving static
# assets, configured by `wrangler.jsonc`. Needs the secrets CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID; see docs/releasing.md.

on:
  push:
    branches: [main]
    paths: ["site/**", "wrangler.jsonc", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy to Cloudflare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; not deploying."
            exit 0
          fi
          npx --yes wrangler@4.156.0 deploy --message "$(git log -1 --format='%h %s')"
