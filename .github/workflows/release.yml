name: Release

# Push a tag `vX.Y.Z` (or `vX.Y.Z-rc.N`) to build the macOS app and publish it on a GitHub release
# and on dl.pdfxray.app (Cloudflare R2).
# The tag's version must match `[workspace.package].version` in Cargo.toml (xtask checks).
# See docs/releasing.md for the secrets and variables this uses; without them the workflow still
# runs, with an ad-hoc signed build (which has no updater) and no Cloudflare upload.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# Two releases must not race for `latest/` on the download host.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  macos:
    name: universal macOS bundle
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml (1.99.1 + clippy + rustfmt)
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Which credentials are configured?
        id: creds
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing() { for name in "$@"; do [ -n "${!name}" ] || printf ' %s' "$name"; done; }
          sign_missing="$(missing MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD MACOS_SIGN_IDENTITY)"
          if [ -z "$(missing APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER)" ]; then notary=api-key
          elif [ -z "$(missing APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD)" ]; then notary=apple-id
          else notary=none; fi
          if [ -z "$sign_missing" ] && [ "$notary" != none ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
            echo "notary=$notary" >> "$GITHUB_OUTPUT"
            echo "Developer ID signing + notarization ($notary)."
          else
            echo "sign=false" >> "$GITHUB_OUTPUT"
            [ "$notary" = none ] && sign_missing="$sign_missing notarization (APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER)"
            echo "::warning::Missing:$sign_missing. Building an ad-hoc signed (not notarized) bundle."
          fi
          # Only notarized builds go to the public download host.
          if [ -z "$sign_missing" ] && [ "$notary" != none ] && [ -z "$(missing CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID)" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Not uploading to Cloudflare: needs a notarized build and CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID."
          fi

      - name: Import the signing certificate into a temporary keychain
        if: steps.creds.outputs.sign == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/pdfxray-signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "::add-mask::$keychain_password"
          echo "KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain"
          # the existing keychains are one word each: splitting the list is intended
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/certificate.p12"

      - name: Write the notarization API key
        if: steps.creds.outputs.notary == 'api-key'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          # The secret holds the base64 of AuthKey_<ID>.p8; xtask wants the file's path.
          echo "$APPLE_API_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Bundle (Developer ID signed + notarized)
        if: steps.creds.outputs.sign == 'true'
        env:
          NOTARY: ${{ steps.creds.outputs.notary }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          if [ "$NOTARY" = api-key ]; then
            export APPLE_API_KEY="$APPLE_API_KEY_PATH"
          else
            unset APPLE_API_KEY_ID APPLE_API_ISSUER
          fi
          cargo xtask bundle --target universal --version "${GITHUB_REF_NAME#v}" \
            --sign "$MACOS_SIGN_IDENTITY" --notarize --dmg

      - name: Bundle (ad-hoc signed)
        if: steps.creds.outputs.sign != 'true'
        run: cargo xtask bundle --target universal --version "${GITHUB_REF_NAME#v}" --dmg

      - name: Verify the bundle
        env:
          SIGNED: ${{ steps.creds.outputs.sign }}
        run: |
          cd target/bundle
          zip="$(ls pdfxray-*-macos-universal.zip)"
          rm -rf verify && mkdir verify
          ditto -x -k "$zip" verify
          top="verify/${zip%.zip}"
          lipo -archs "$top/pdfxray" | grep -q 'x86_64'
          lipo -archs "$top/pdfxray" | grep -q 'arm64'
          lipo -archs "$top/pdfxray.app/Contents/MacOS/pdfxray-app" | grep -q 'x86_64'
          lipo -archs "$top/pdfxray.app/Contents/MacOS/pdfxray-app" | grep -q 'arm64'
          codesign --verify --strict --verbose=2 "$top/pdfxray"
          codesign --verify --strict --verbose=2 "$top/pdfxray.app"
          codesign -dv --verbose=4 "$top/pdfxray.app" 2>&1 | grep -E 'Authority|TeamIdentifier|Signature|flags'
          "$top/pdfxray" --version
          "$top/pdfxray.app/Contents/MacOS/pdfxray" --version
          if [ "$SIGNED" = "true" ]; then
            spctl -a -vv --type exec "$top/pdfxray.app"
            xcrun stapler validate "$top/pdfxray.app"
          fi
          rm -rf verify

          dmg="$(ls pdfxray-*-macos-universal.dmg)"
          hdiutil verify "$dmg"
          mnt="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          test "$(readlink "$mnt/Applications")" = /Applications
          codesign --verify --strict --verbose=2 "$mnt/pdfxray.app"
          "$mnt/pdfxray.app/Contents/MacOS/pdfxray" --version
          if [ "$SIGNED" = "true" ]; then
            spctl -a -vv --type exec "$mnt/pdfxray.app"
          fi
          hdiutil detach "$mnt"
          if [ "$SIGNED" = "true" ]; then
            codesign --verify --strict --verbose=2 "$dmg"
            spctl -a -vv -t open --context context:primary-signature "$dmg"
            xcrun stapler validate "$dmg"
          fi

      - name: Checksums and release notes
        env:
          SIGNED: ${{ steps.creds.outputs.sign }}
        run: |
          cd target/bundle
          shasum -a 256 pdfxray-*-macos-universal.dmg pdfxray-*-macos-universal.zip | tee SHA256SUMS
          {
            if [ "$SIGNED" = "true" ]; then
              echo "macOS universal build (Apple Silicon and Intel, macOS 11+), signed with a Developer ID and notarized by Apple."
            else
              echo "macOS universal build (Apple Silicon and Intel, macOS 11+), **ad-hoc signed, not notarized**."
              echo "Gatekeeper blocks it after download: see \"Gatekeeper and ad-hoc builds\" in docs/releasing.md."
            fi
            echo
            echo "Verify the download with \`shasum -a 256 -c SHA256SUMS\`."
          } > RELEASE_NOTES.md

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/bundle/pdfxray-*-macos-universal.dmg
            target/bundle/pdfxray-*-macos-universal.zip
            target/bundle/SHA256SUMS
          body_path: target/bundle/RELEASE_NOTES.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true

      - name: Upload to dl.pdfxray.app (Cloudflare R2)
        if: steps.creds.outputs.publish == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'pdfxray-releases' }}
          STABLE: ${{ !contains(github.ref_name, '-') }}
        run: |
          cd target/bundle
          version="${GITHUB_REF_NAME#v}"
          put() { # key, file, content type, cache control
            npx --yes wrangler@4.156.0 r2 object put "$R2_BUCKET/$1" --remote \
              --file "$2" --content-type "$3" --cache-control "$4"
          }
          immutable="public, max-age=31536000, immutable"
          for f in pdfxray-*-macos-universal.dmg; do put "releases/$version/$f" "$f" application/x-apple-diskimage "$immutable"; done
          for f in pdfxray-*-macos-universal.zip; do put "releases/$version/$f" "$f" application/zip "$immutable"; done
          put "releases/$version/SHA256SUMS" SHA256SUMS "text/plain; charset=utf-8" "$immutable"
          # Release candidates stay under releases/<version>/; only a stable release moves latest/.
          if [ "$STABLE" = "true" ]; then
            put latest/pdfxray-macos-universal.dmg pdfxray-*-macos-universal.dmg application/x-apple-diskimage "public, max-age=300"
          fi

      - name: Publish the update feed (stable releases only)
        if: steps.creds.outputs.publish == 'true' && !contains(github.ref_name, '-')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'pdfxray-releases' }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "::warning::SPARKLE_ED_PRIVATE_KEY is not set: installed copies will not be offered this release."
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          dmg="pdfxray-$version-macos-universal.dmg"
          # The DMG was uploaded by the previous step, so the feed never points at a missing file.
          cargo xtask sparkle appcast --version "$version" \
            --archive "target/bundle/$dmg" \
            --url "https://dl.pdfxray.app/releases/$version/$dmg" \
            --out target/bundle/appcast.xml
          npx --yes wrangler@4.156.0 r2 object put "$R2_BUCKET/appcast.xml" --remote \
            --file target/bundle/appcast.xml --content-type "application/xml; charset=utf-8" \
            --cache-control "public, max-age=300"

      - name: Remove the temporary keychain and API key
        if: always() && steps.creds.outputs.sign == 'true'
        run: |
          if [ -n "$KEYCHAIN_PATH" ]; then security delete-keychain "$KEYCHAIN_PATH" || true; fi
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/AuthKey.p8"
