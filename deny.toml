# cargo-deny policy: pdfxray ships under MIT and must never link copyleft code.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Only flag unmaintained crates we depend on directly; transitive ones (e.g. ttf-parser,
# zbus via accesskit) are tracked upstream. Vulnerabilities are always denied.
unmaintained = "workspace"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "BSL-1.0",
  "CC0-1.0",
  "OFL-1.1",
  "Ubuntu-font-1.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]
# No GPL / LGPL / AGPL anywhere in the graph.

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
